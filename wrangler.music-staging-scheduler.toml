# Music scheduler shared by production and staging. No workers.dev route.
name = "moodverse-music-staging-scheduler"
main = "./cron-worker.ts"
compatibility_date = "2026-09-22"
workers_dev = false

[triggers]
crons = ["*/5 * * * *"]

[assets]
directory = "./scripts"
binding = "ASSETS"

[vars]
MUSIC_DEMO_SEED_ENABLED = "false"
MUSIC_DEMO_SOCIAL_ENABLED = "true"

[[d1_databases]]
binding = "DB"
database_name = "moodverse-music-staging-db"
database_id = "58d7ea1b-aaaf-4639-8adb-5fb2136dddf4"
migrations_dir = "./migrations-music-staging"
