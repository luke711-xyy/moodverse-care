# Isolated Cloudflare Pages config for the music MVP. Keep the placeholder until
# a dedicated staging D1 database exists; never copy the ID from wrangler.toml.
name = "moodverse-music-staging"
compatibility_date = "2026-09-22"
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "moodverse-music-staging-db"
database_id = "REPLACE_WITH_STAGING_D1_DATABASE_ID"
migrations_dir = "./migrations-music-staging"
