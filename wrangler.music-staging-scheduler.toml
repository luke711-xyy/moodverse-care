# Isolated scheduled Worker for the music MVP. It shares only the staging D1
# database with Pages and deliberately has no workers.dev route.
name = "moodverse-music-staging-scheduler"
main = "./cron-worker.ts"
compatibility_date = "2026-09-22"
workers_dev = false

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "moodverse-music-staging-db"
database_id = "REPLACE_WITH_STAGING_D1_DATABASE_ID"
migrations_dir = "./migrations-music-staging"
