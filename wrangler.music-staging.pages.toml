# Isolated Cloudflare Pages config for the music MVP. Never copy the production
# D1 ID from wrangler.toml.
name = "moodverse-music-staging"
compatibility_date = "2026-09-22"
pages_build_output_dir = "./dist"

# Like the music D1 data, Moment photos are shared with the music production site.
[[r2_buckets]]
binding = "MUSIC_MEDIA"
bucket_name = "moodverse-music-media"

[[env.production.r2_buckets]]
binding = "MUSIC_MEDIA"
bucket_name = "moodverse-music-media"

[[d1_databases]]
binding = "DB"
database_name = "moodverse-music-staging-db"
database_id = "58d7ea1b-aaaf-4639-8adb-5fb2136dddf4"
migrations_dir = "./migrations-music-staging"

# The staging Pages project's `main` branch runs as its Production environment.
# Override the dashboard's old production binding so this project can never
# reach the moodverse-care production database.
[[env.production.d1_databases]]
binding = "DB"
database_name = "moodverse-music-staging-db"
database_id = "58d7ea1b-aaaf-4639-8adb-5fb2136dddf4"
migrations_dir = "./migrations-music-staging"

[env.production.vars]
MUSIC_EMAIL_LOGIN_ENABLED = "false"
MUSIC_ALLOW_LEGACY_ACCESS_AUTH = "false"

[vars]
MUSIC_EMAIL_LOGIN_ENABLED = "false"
MUSIC_ALLOW_LEGACY_ACCESS_AUTH = "false"
